<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudioCS — Aprende a Programar</title>
<meta name="theme-color" content="#131f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EstudioCS">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #131f24; color: #f1f7fb; min-height: 100vh; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #0e1a1f; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; border-right: 1px solid #2b4048; position: sticky; top: 0; height: 100vh; }
  .logo { font-size: 1.2rem; font-weight: 800; color: #58cc02; padding: 0 .5rem; }
  .nav { display: flex; flex-direction: column; gap: .4rem; flex: 1; }
  .nav button { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; background: transparent; border: none; color: #8a9ba3; font-size: .95rem; font-weight: 600; cursor: pointer; border-radius: 10px; text-align: left; font-family: inherit; transition: all .15s; }
  .nav button:hover { background: #1f2f36; color: #f1f7fb; }
  .nav button.activo { background: #1f2f36; color: #58cc02; border-left: 3px solid #58cc02; }
  .racha-mini { display: flex; align-items: center; justify-content: center; gap: .4rem; background: #ff9600; color: #fff; padding: .7rem; border-radius: 12px; font-weight: 800; font-size: 1.1rem; box-shadow: 0 4px 0 #c47400; }
  main { padding: 1.5rem; max-width: 900px; margin: 0 auto; width: 100%; }
  h1 { font-size: 1.5rem; margin-bottom: .3rem; }
  .sub { color: #8a9ba3; margin-bottom: 1.5rem; font-size: .9rem; }
  .card { background: #1f2f36; border: 1px solid #2b4048; border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1.05rem; margin-bottom: .8rem; color: #58cc02; }
  .calendario { display: flex; justify-content: space-between; gap: .4rem; margin-bottom: 1.5rem; }
  .dia { flex: 1; text-align: center; padding: .6rem .2rem; background: #1f2f36; border: 1px solid #2b4048; border-radius: 10px; font-size: .7rem; color: #8a9ba3; }
  .dia.activo { background: #58cc02; color: #fff; border-color: #58cc02; font-weight: 700; }
  .dia.hoy { border: 2px solid #f1f7fb; }
  .dia .flama { font-size: 1.1rem; display: block; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: .6rem; margin-bottom: 1.5rem; }
  .stat { background: #1f2f36; border: 1px solid #2b4048; border-radius: 12px; padding: .8rem; text-align: center; }
  .stat .num { font-size: 1.4rem; font-weight: 700; color: #58cc02; }
  .stat .lbl { font-size: .65rem; color: #8a9ba3; text-transform: uppercase; letter-spacing: .5px; }
  .lenguajes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
  .lenguaje-card { background: #1f2f36; border: 1px solid #2b4048; border-radius: 16px; padding: 1rem; cursor: pointer; transition: all .15s; }
  .lenguaje-card:hover { border-color: #58cc02; transform: translateY(-2px); }
  .lenguaje-card h3 { font-size: 1rem; margin-bottom: .2rem; }
  .lenguaje-card .emoji { font-size: 2rem; display: block; margin-bottom: .5rem; }
  .lenguaje-card .desc { font-size: .8rem; color: #8a9ba3; }
  .barra { height: 8px; background: #2b4048; border-radius: 999px; overflow: hidden; margin-top: .6rem; }
  .barra > div { height: 100%; background: #58cc02; transition: width .3s; }
  .leccion-card { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1f2f36; border: 1px solid #2b4048; border-radius: 12px; margin-bottom: .6rem; cursor: pointer; }
  .leccion-card:hover { border-color: #58cc02; }
  .leccion-card.completada { opacity: .6; border-color: #58cc02; }
  .leccion-card .check { color: #58cc02; font-size: 1.3rem; }
  .teoria { background: #0e1a1f; border-left: 3px solid #58cc02; padding: 1rem; border-radius: 8px; margin: 1rem 0; font-family: ui-monospace, monospace; font-size: .85rem; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; }
  .pregunta { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
  .opciones { display: flex; flex-direction: column; gap: .6rem; }
  .opcion { padding: .9rem 1rem; background: #1f2f36; border: 2px solid #2b4048; border-radius: 12px; color: #f1f7fb; font-size: 1rem; text-align: left; cursor: pointer; font-family: inherit; }
  .opcion:hover { border-color: #58cc02; }
  .opcion.correcta { background: #1a3a1a; border-color: #58cc02; color: #58cc02; }
  .opcion.incorrecta { background: #3a1a1a; border-color: #ff4b4b; color: #ff4b4b; }
  .opcion:disabled { cursor: not-allowed; }
  button.btn { padding: .9rem 1.5rem; background: #58cc02; color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 #46a302; font-family: inherit; }
  button.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #46a302; }
  button.btn.sec { background: #1f2f36; color: #f1f7fb; box-shadow: 0 4px 0 #0e1a1f; border: 1px solid #2b4048; }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  .volver { background: none; border: none; color: #8a9ba3; cursor: pointer; font-size: .9rem; padding: .4rem 0; margin-bottom: .5rem; font-family: inherit; }
  .volver:hover { color: #f1f7fb; }
  .feedback { padding: .8rem 1rem; border-radius: 12px; margin-top: .8rem; font-weight: 600; }
  .feedback.ok { background: #1a3a1a; color: #58cc02; }
  .feedback.bad { background: #3a1a1a; color: #ff4b4b; }
  .tutor-wrap { display: flex; flex-direction: column; height: calc(100vh - 3rem); gap: 1rem; }
  .material-box { background: #1f2f36; border: 1px solid #2b4048; border-radius: 12px; padding: .8rem 1rem; }
  .material-box summary { cursor: pointer; color: #58cc02; font-weight: 700; font-size: .9rem; }
  .material-box textarea { width: 100%; margin-top: .7rem; min-height: 80px; resize: vertical; background: #0e1a1f; color: #f1f7fb; border: 1px solid #2b4048; border-radius: 8px; padding: .6rem; font-family: inherit; font-size: .85rem; }
  .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .8rem; padding: .5rem 0; }
  .msg { display: flex; gap: .6rem; max-width: 90%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .msg.user .avatar { background: #58cc02; }
  .msg.ia .avatar { background: #1f2f36; border: 1px solid #2b4048; }
  .msg .burbuja { padding: .8rem 1rem; border-radius: 14px; line-height: 1.5; font-size: .9rem; word-wrap: break-word; }
  .msg.user .burbuja { background: #58cc02; color: #fff; border-bottom-right-radius: 4px; }
  .msg.ia .burbuja { background: #1f2f36; border: 1px solid #2b4048; border-bottom-left-radius: 4px; }
  .msg.ia .burbuja pre { background: #0e1a1f; padding: .8rem; border-radius: 8px; overflow-x: auto; margin: .6rem 0; font-size: .8rem; }
  .msg.ia .burbuja code { background: #0e1a1f; padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
  .msg.ia .burbuja pre code { background: none; padding: 0; }
  .sugerencias { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
  .sug { background: #1f2f36; border: 1px solid #2b4048; color: #f1f7fb; padding: .5rem .8rem; border-radius: 999px; font-size: .8rem; cursor: pointer; font-family: inherit; }
  .sug:hover { border-color: #58cc02; }
  .input-row { display: flex; gap: .5rem; }
  .input-row input { flex: 1; padding: .9rem 1rem; background: #1f2f36; border: 1px solid #2b4048; border-radius: 12px; color: #f1f7fb; font-size: 1rem; font-family: inherit; }
  .input-row input:focus { outline: none; border-color: #58cc02; }
  .input-row button { width: 50px; background: #58cc02; border: none; border-radius: 12px; color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 0 #46a302; }
  .input-row button:disabled { opacity: .5; }
  .typing { display: flex; gap: 4px; padding: .3rem 0; }
  .typing span { width: 8px; height: 8px; background: #8a9ba3; border-radius: 50%; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: .85rem; color: #8a9ba3; margin-bottom: .4rem; }
  .field input, .field select { width: 100%; padding: .8rem 1rem; background: #0e1a1f; border: 1px solid #2b4048; border-radius: 10px; color: #f1f7fb; font-family: inherit; font-size: .9rem; }
  .field input:focus, .field select:focus { outline: none; border-color: #58cc02; }
  .aviso { background: #3a2a0e; border-left: 3px solid #ff9600; padding: .8rem 1rem; border-radius: 8px; font-size: .85rem; color: #ffd8a8; line-height: 1.5; margin-bottom: 1rem; }
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; padding-bottom: 80px; }
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: 70px; flex-direction: row; padding: .5rem; border-right: none; border-top: 1px solid #2b4048; align-items: center; justify-content: space-around; z-index: 100; }
    .logo, .racha-mini { display: none; }
    .nav { flex-direction: row; flex: 1; justify-content: space-around; }
    .nav button { flex-direction: column; gap: .2rem; font-size: .7rem; padding: .5rem; }
    main { padding: 1rem; }
    .tutor-wrap { height: calc(100vh - 140px); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🔥 EstudioCS</div>
    <nav class="nav">
      <button data-tab="home" class="activo">🏠 <span>Inicio</span></button>
      <button data-tab="tutor">💬 <span>Tutor IA</span></button>
      <button data-tab="config">⚙️ <span>Config</span></button>
    </nav>
    <div class="racha-mini">🔥 <span id="rachaMini">0</span></div>
  </aside>
  <main id="vista"></main>
</div>

<script>
/* ========== DATOS ========== */
const LENGUAJES = [
  { id:'python', nombre:'Python', emoji:'🐍', desc:'El más usado en ciencia y backend' },
  { id:'javascript', nombre:'JavaScript', emoji:'⚡', desc:'El lenguaje de la web' },
  { id:'git', nombre:'Git & GitHub', emoji:'🐙', desc:'Imprescindible en equipo' },
  { id:'markdown', nombre:'Markdown', emoji:'📝', desc:'El lenguaje de los README' }
];

const LECCIONES = [
  { id:'py-01', lenguaje:'python', titulo:'Variables y tipos',
    teoria:`# Variables: guardan valores
nombre = "Ana"      # str
edad = 25           # int
altura = 1.68       # float
es_alumno = True    # bool

print(nombre)  # → Ana`,
    preguntas:[
      {q:'¿Qué tipo es x = 42?',opciones:['str','int','float','bool'],correcta:1},
      {q:'¿Qué tipo es x = 3.14?',opciones:['int','float','str','list'],correcta:1},
      {q:'¿Qué imprime print("Hola" + " mundo")?',opciones:['Hola mundo','Error','Holamundo','Hola+ mundo'],correcta:0}
    ]
  },
  { id:'py-02', lenguaje:'python', titulo:'Condicionales',
    teoria:`edad = 18
if edad >= 18:
    print("Mayor")
elif edad >= 13:
    print("Adolescente")
else:
    print("Niño")

# La indentación es obligatoria`,
    preguntas:[
      {q:'¿Qué palabra se usa para "si no"?',opciones:['else','elif','elseif','otherwise'],correcta:0},
      {q:'¿Cuántos espacios de indentación son estándar?',opciones:['2','3','4','8'],correcta:2},
      {q:'¿Qué operador significa "igual a"?',opciones:['=','==','===','eq'],correcta:1}
    ]
  },
  { id:'py-03', lenguaje:'python', titulo:'Listas y bucles',
    teoria:`frutas = ["manzana", "pera", "uva"]
for fruta in frutas:
    print(fruta)

print(frutas[0])  # manzana
frutas.append("kiwi")`,
    preguntas:[
      {q:'¿Índice del primer elemento?',opciones:['0','1','-1','null'],correcta:0},
      {q:'¿Qué método añade al final?',opciones:['add()','push()','append()','insert()'],correcta:2},
      {q:'¿Qué imprime len([1,2,3])?',opciones:['2','3','4','Error'],correcta:1}
    ]
  },
  { id:'js-01', lenguaje:'javascript', titulo:'let y const',
    teoria:`let contador = 0;
contador = 1;

const PI = 3.1416;
// PI = 3;  ← Error!`,
    preguntas:[
      {q:'¿Cuál se usa para constantes?',opciones:['let','const','var','static'],correcta:1},
      {q:'¿Qué pasa si reasignas una const?',opciones:['Se cambia','Error','Nada','Se vuelve let'],correcta:1},
      {q:'¿Qué declaración es obsoleta?',opciones:['let','const','var','final'],correcta:2}
    ]
  },
  { id:'js-02', lenguaje:'javascript', titulo:'Funciones',
    teoria:`function sumar(a, b) {
  return a + b;
}
const restar = (a, b) => a - b;

console.log(sumar(2, 3));  // 5`,
    preguntas:[
      {q:'¿Qué palabra devuelve un valor?',opciones:['return','print','yield','output'],correcta:0},
      {q:'¿Cuál es arrow function?',opciones:['function f(){}','const f = () => {}','f = function{}','def f():'],correcta:1},
      {q:'¿Qué imprime 2 + "2"?',opciones:['4','"22"','NaN','Error'],correcta:1}
    ]
  },
  { id:'git-01', lenguaje:'git', titulo:'Tu primer commit',
    teoria:`git init
git add archivo.txt
git commit -m "Mensaje"
git status
git log --oneline`,
    preguntas:[
      {q:'¿Qué comando inicializa?',opciones:['git start','git init','git new','git create'],correcta:1},
      {q:'¿Qué hace git add?',opciones:['Borra','Prepara cambios','Sube a GitHub','Clona'],correcta:1},
      {q:'¿Qué comando guarda cambios?',opciones:['git save','git commit','git push','git store'],correcta:1}
    ]
  },
  { id:'git-02', lenguaje:'git', titulo:'Conectar con GitHub',
    teoria:`git clone https://github.com/user/repo.git
git push origin main
git pull origin main
git checkout -b nueva-rama`,
    preguntas:[
      {q:'¿Qué comando descarga un repo?',opciones:['git get','git clone','git pull','git fetch'],correcta:1},
      {q:'¿Qué comando sube cambios?',opciones:['git push','git send','git upload','git commit'],correcta:0},
      {q:'¿Qué crea una rama?',opciones:['git branch -b','git checkout -b','git new','git split'],correcta:1}
    ]
  },
  { id:'md-01', lenguaje:'markdown', titulo:'README básico',
    teoria:`# Título
## Subtítulo

**negrita**  *cursiva*

- lista
- de items

[link](url)`,
    preguntas:[
      {q:'¿Cuántos # para el título más grande?',opciones:['1','2','3','6'],correcta:0},
      {q:'¿Cómo se hace negrita?',opciones:['_texto_','**texto**','#texto#','texto'],correcta:1},
      {q:'¿Cómo se crea un enlace?',opciones:['[texto](url)','<url>','link:url','(url)'],correcta:0}
    ]
  },
  { id:'md-02', lenguaje:'markdown', titulo:'Tablas y tareas',
    teoria:`| Col 1 | Col 2 |
|-------|-------|
| A     | B     |

- [x] Hecho
- [ ] Pendiente

> Cita`,
    preguntas:[
      {q:'¿Cómo marcas tarea hecha?',opciones:['[x]','[ok]','(*)','{done}'],correcta:0},
      {q:'¿Qué símbolo hace cita?',opciones:['"','>','#','@'],correcta:1},
      {q:'¿Qué separa columnas?',opciones:[',','|',';','tab'],correcta:1}
    ]
  },
  { id:'js-03', lenguaje:'javascript', titulo:'Manipular el DOM',
    teoria:`document.getElementById("titulo").textContent = "Hola";

document.getElementById("boton").addEventListener("click", () => {
  alert("¡Clic!");
});`,
    preguntas:[
      {q:'¿Cómo seleccionas por id?',opciones:['getElementById','queryId','selectId','findById'],correcta:0},
      {q:'¿Método que escucha eventos?',opciones:['on()','listen()','addEventListener','watch()'],correcta:2},
      {q:'¿Propiedad que cambia texto?',opciones:['innerHTML','value','textContent','string'],correcta:2}
    ]
  }
];

/* ========== ESTADO ========== */
function hoyStr(){ return new Date().toISOString().slice(0,10); }

function cargarEstado(){
  let e = JSON.parse(localStorage.getItem('estado')||'null');
  if(!e) e = { racha:0, ultimoDia:null, diasActivos:[], completadas:[], chat:[], material:'' };
  const hoy = hoyStr();
  const ayer = new Date(); ayer.setDate(ayer.getDate()-1);
  const ayerS = ayer.toISOString().slice(0,10);
  if(e.ultimoDia && e.ultimoDia !== hoy && e.ultimoDia !== ayerS) e.racha = 0;
  localStorage.setItem('estado', JSON.stringify(e));
  return e;
}
function guardarEstado(e){ localStorage.setItem('estado', JSON.stringify(e)); }

function actualizarRacha(){
  const e = cargarEstado();
  const hoy = hoyStr();
  if(e.ultimoDia === hoy) return;
  const ayer = new Date(); ayer.setDate(ayer.getDate()-1);
  if(e.ultimoDia === ayer.toISOString().slice(0,10)) e.racha++; else e.racha = 1;
  e.ultimoDia = hoy;
  if(!e.diasActivos.includes(hoy)){
    e.diasActivos.push(hoy);
    if(e.diasActivos.length > 30) e.diasActivos.shift();
  }
  guardarEstado(e);
}

let estado = cargarEstado();
let tab = 'home', lengActual = null, lecActual = null;
let pregIdx = 0, aciertos = 0, cargandoIA = false;

/* ========== RENDER ========== */
function render(){
  estado = cargarEstado();
  document.getElementById('rachaMini').textContent = estado.racha;
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('activo', b.dataset.tab === tab);
  });
  const el = document.getElementById('vista');
  if(tab === 'home') renderHome(el);
  else if(tab === 'tutor') renderTutor(el);
  else if(tab === 'config') renderConfig(el);
  else if(tab === 'lenguaje') renderLenguaje(el);
  else if(tab === 'leccion') renderLeccion(el);
}

function renderHome(el){
  const total = LECCIONES.length;
  const hechas = estado.completadas.length;
  const dias = ['D','L','M','X','J','V','S'];
  let cal = '';
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const activo = estado.diasActivos.includes(ds);
    cal += `<div class="dia ${activo?'activo':''} ${i===0?'hoy':''}"><span class="flama">${activo?'🔥':'·'}</span>${dias[d.getDay()]} ${d.getDate()}</div>`;
  }
  el.innerHTML = `
    <h1>Hola 👋</h1>
    <p class="sub">Racha de ${estado.racha} días · ${hechas} de ${total} lecciones completadas</p>
    <div class="calendario">${cal}</div>
    <div class="stats">
      <div class="stat"><div class="num">${estado.racha}</div><div class="lbl">Racha</div></div>
      <div class="stat"><div class="num">${hechas}</div><div class="lbl">Lecciones</div></div>
      <div class="stat"><div class="num">${total}</div><div class="lbl">Total</div></div>
    </div>
    <div class="card">
      <h2>📚 Mis cursos</h2>
      <div class="lenguajes">
        ${LENGUAJES.map(l => {
          const tot = LECCIONES.filter(x=>x.lenguaje===l.id).length;
          const hc = LECCIONES.filter(x=>x.lenguaje===l.id && estado.completadas.includes(x.id)).length;
          const pct = tot ? (hc/tot*100) : 0;
          return `<div class="lenguaje-card" onclick="abrirLenguaje('${l.id}')">
            <span class="emoji">${l.emoji}</span>
            <h3>${l.nombre}</h3>
            <div class="desc">${l.desc}</div>
            <div class="barra"><div style="width:${pct}%"></div></div>
            <div style="font-size:.75rem;color:#8a9ba3;margin-top:.3rem">${hc}/${tot} lecciones</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <h2>💬 ¿Dudas? Pregúntale al Tutor IA</h2>
      <p style="color:#8a9ba3;font-size:.9rem;margin-bottom:1rem">Tu tutor de informática disponible 24/7. Puedes pegar tus apuntes y preguntarle sobre ellos.</p>
      <button class="btn" onclick="irTab('tutor')">Abrir Tutor IA</button>
    </div>`;
}

function renderLenguaje(el){
  const lang = LENGUAJES.find(l=>l.id===lengActual);
  const lecs = LECCIONES.filter(l=>l.lenguaje===lengActual);
  el.innerHTML = `
    <button class="volver" onclick="irTab('home')">← Volver</button>
    <h1>${lang.emoji} ${lang.nombre}</h1>
    <p class="sub">${lang.desc}</p>
    ${lecs.map(lec => {
      const done = estado.completadas.includes(lec.id);
      return `<div class="leccion-card ${done?'completada':''}" onclick="abrirLeccion('${lec.id}')">
        <div>
          <div style="font-weight:600">${lec.titulo}</div>
          <div style="font-size:.8rem;color:#8a9ba3">${lec.preguntas.length} preguntas</div>
        </div>
        <div class="check">${done?'✓':'▶'}</div>
      </div>`;
    }).join('')}`;
}

function renderLeccion(el){
  const lec = LECCIONES.find(l=>l.id===lecActual);
  const p = lec.preguntas[pregIdx];
  el.innerHTML = `
    <button class="volver" onclick="volverLenguaje()">← Salir</button>
    <div class="card">
      <div style="font-size:.8rem;color:#8a9ba3;margin-bottom:.5rem">${lec.titulo} · ${pregIdx+1}/${lec.preguntas.length}</div>
      <div class="barra" style="margin-bottom:1rem"><div style="width:${(pregIdx/lec.preguntas.length)*100}%"></div></div>
      <div class="teoria">${lec.teoria}</div>
      <div class="pregunta">${p.q}</div>
      <div class="opciones">
        ${p.opciones.map((op,i)=>`<button class="opcion" onclick="responder(${i})" id="op-${i}">${op}</button>`).join('')}
      </div>
      <div id="feedback"></div>
    </div>`;
}

function responder(idx){
  const lec = LECCIONES.find(l=>l.id===lecActual);
  const p = lec.preguntas[pregIdx];
  document.querySelectorAll('.opcion').forEach(b=>b.disabled=true);
  const ok = idx === p.correcta;
  document.getElementById('op-'+idx).classList.add(ok?'correcta':'incorrecta');
  if(!ok) document.getElementById('op-'+p.correcta).classList.add('correcta');
  if(ok) aciertos++;
  document.getElementById('feedback').innerHTML = `
    <div class="feedback ${ok?'ok':'bad'}">${ok?'✓ ¡Correcto!':'✗ Era: '+p.opciones[p.correcta]}</div>
    <button class="btn" onclick="siguientePregunta()">${pregIdx+1<lec.preguntas.length?'Siguiente':'Terminar'}</button>`;
}

function siguientePregunta(){
  const lec = LECCIONES.find(l=>l.id===lecActual);
  pregIdx++;
  if(pregIdx >= lec.preguntas.length){
    const pct = aciertos/lec.preguntas.length;
    if(pct >= 0.6){
      const e = cargarEstado();
      if(!e.completadas.includes(lec.id)){ e.completadas.push(lec.id); guardarEstado(e); actualizarRacha(); }
    }
    renderFin(pct);
  } else render();
}

function renderFin(pct){
  const el = document.getElementById('vista');
  const lec = LECCIONES.find(l=>l.id===lecActual);
  const ok = pct >= 0.6;
  el.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:3.5rem;margin:1rem 0">${ok?'🎉':'😅'}</div>
      <h2>${ok?'¡Lección completada!':'Casi lo logras'}</h2>
      <p style="margin:1rem 0;color:#8a9ba3">Acertaste ${aciertos} de ${lec.preguntas.length} (${Math.round(pct*100)}%)</p>
      ${ok?`<p style="color:#58cc02;font-weight:700">🔥 Racha: ${estado.racha} días</p>`:'<p style="color:#ff9600">Necesitas 60% para aprobar</p>'}
      <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
        <button class="btn sec" onclick="volverLenguaje()">Ver más</button>
        <button class="btn" onclick="abrirLeccion('${lec.id}')">Repetir</button>
      </div>
    </div>`;
}

/* ========== TUTOR IA (via proxy /api/chat) ========== */
function renderTutor(el){
  el.innerHTML = `
    <div class="tutor-wrap">
      <div>
        <h1>💬 Tutor IA</h1>
        <p class="sub">Tu tutor de informática. Puedes pegar tus apuntes para que te ayude con ellos.</p>
      </div>
      <details class="material-box">
        <summary>📎 Material de estudio (opcional)</summary>
        <textarea id="material" placeholder="Pega aquí tus apuntes, dudas previas o el tema que estás estudiando...">${estado.material||''}</textarea>
        <button class="btn sec" style="margin-top:.5rem;font-size:.85rem;padding:.6rem 1rem" onclick="guardarMaterial()">Guardar material</button>
      </details>
      <div class="chat" id="chat"></div>
      <div class="sugerencias">
        <button class="sug" onclick="preguntar('Explícame qué es una variable con ejemplos en Python')">¿Qué es una variable?</button>
        <button class="sug" onclick="preguntar('¿Cómo funciona Git y para qué sirve el commit?')">¿Cómo funciona Git?</button>
        <button class="sug" onclick="preguntar('Dame 3 ejercicios fáciles de Python para practicar')">Dame ejercicios</button>
      </div>
      <div class="input-row">
        <input id="msgInput" placeholder="Escribe tu pregunta...">
        <button id="sendBtn" onclick="enviar()">➤</button>
      </div>
    </div>`;
  pintarChat();
  document.getElementById('msgInput')?.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
  });
}

function pintarChat(){
  const c = document.getElementById('chat');
  if(!c) return;
  const e = cargarEstado();
  if(!e.chat || e.chat.length === 0){
    c.innerHTML = `<div style="text-align:center;color:#8a9ba3;padding:2rem 1rem">
      <div style="font-size:3rem;margin-bottom:.5rem">🎓</div>
      <p>Pregúntame lo que quieras sobre programación o informática.</p>
      <p style="font-size:.85rem;margin-top:.5rem">Ejemplo: "¿Qué es una función?"</p>
    </div>`;
    return;
  }
  c.innerHTML = e.chat.map(m => `
    <div class="msg ${m.role==='user'?'user':'ia'}">
      <div class="avatar">${m.role==='user'?'👤':'🎓'}</div>
      <div class="burbuja">${m.role==='user'?escapeHTML(m.text):md(m.text)}</div>
    </div>
  `).join('');
  if(cargandoIA){
    c.innerHTML += `<div class="msg ia"><div class="avatar">🎓</div><div class="burbuja"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  }
  c.scrollTop = c.scrollHeight;
}

function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(text){
  let h = escapeHTML(text);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (m,l,c) => `<pre><code>${c.trim()}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

function guardarMaterial(){
  const e = cargarEstado();
  e.material = document.getElementById('material').value;
  guardarEstado(e);
  alert('✓ Material guardado');
}

function irTab(t){
  tab = t;
  if(t !== 'lenguaje' && t !== 'leccion'){ lengActual = null; lecActual = null; }
  render();
}
function abrirLenguaje(id){ tab='lenguaje'; lengActual=id; render(); }
function volverLenguaje(){ tab='lenguaje'; render(); }
function abrirLeccion(id){ tab='leccion'; lecActual=id; pregIdx=0; aciertos=0; render(); }

function preguntar(texto){
  const input = document.getElementById('msgInput');
  if(input){ input.value = texto; }
  enviar();
}

async function enviar(){
  if(cargandoIA) return;
  const input = document.getElementById('msgInput');
  const txt = input.value.trim();
  if(!txt) return;
  input.value = '';
  const e = cargarEstado();
  e.chat.push({ role:'user', text: txt });
  guardarEstado(e);
  cargandoIA = true;
  pintarChat();

  try {
    const model = localStorage.getItem('groqModel') || 'llama-3.3-70b-versatile';
    const historial = e.chat.slice(-16);
    const sysPrompt = `Eres un tutor de informática y programación paciente, claro y motivador. 
Respondes SIEMPRE en español. Das ejemplos de código cortos cuando ayuda. 
Si el alumno tiene material de estudio, úsalo como contexto. 
Si la pregunta es ambigua, pide aclaración brevemente. 
Usa markdown para formatear código y listas. Sé conciso (máx 200 palabras salvo que pidan detalle).`;

    const messages = [{ role:'system', content: sysPrompt }];
    if(e.material) messages.push({ role:'system', content: `Material de estudio del alumno:\n"""\n${e.material}\n"""` });
    historial.forEach(m => messages.push({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.text
    }));

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages, temperature: 0.7, max_tokens: 1024 })
    });

    if(!res.ok){
      let extra = '';
      if(res.status === 429) extra = ' — Límite de rate, espera 1 minuto';
      if(res.status === 400) extra = ' — Modelo no disponible';
      if(res.status === 500) extra = ' — Falta configurar GROQ_API_KEY en Render';
      throw new Error(`Error ${res.status}${extra}`);
    }
    const data = await res.json();
    const respuesta = data.choices?.[0]?.message?.content || 'No pude generar respuesta.';

    const e2 = cargarEstado();
    e2.chat.push({ role:'model', text: respuesta });
    if(e2.chat.length > 40) e2.chat = e2.chat.slice(-40);
    guardarEstado(e2);
  } catch(err){
    const e2 = cargarEstado();
    e2.chat.push({ role:'model', text:'⚠️ ' + err.message });
    guardarEstado(e2);
  } finally {
    cargandoIA = false;
    pintarChat();
  }
}

/* ========== CONFIG ========== */
function renderConfig(el){
  const model = localStorage.getItem('groqModel') || 'llama-3.3-70b-versatile';
  el.innerHTML = `
    <h1>⚙️ Configuración</h1>
    <p class="sub">Ajustes de la app</p>
    <div class="aviso">
      🔒 La API key de Groq está configurada de forma segura en el servidor (Render → Environment). 
      No se guarda en el navegador, así que puedes compartir esta app sin riesgo.
    </div>
    <div class="card">
      <h2>🤖 Modelo de IA</h2>
      <div class="field">
        <label>Elige el modelo de Groq</label>
        <select id="modelSel">
          <option value="llama-3.3-70b-versatile" ${model==='llama-3.3-70b-versatile'?'selected':''}>Llama 3.3 70B (recomendado)</option>
          <option value="llama-3.1-8b-instant" ${model==='llama-3.1-8b-instant'?'selected':''}>Llama 3.1 8B (más rápido)</option>
          <option value="gemma2-9b-it" ${model==='gemma2-9b-it'?'selected':''}>Gemma 2 9B</option>
          <option value="deepseek-r1-distill-llama-70b" ${model==='deepseek-r1-distill-llama-70b'?'selected':''}>DeepSeek R1 Distill (razonamiento)</option>
        </select>
      </div>
      <button class="btn" onclick="guardarModelo()">Guardar modelo</button>
    </div>
    <div class="card">
      <h2>🧹 Datos</h2>
      <p style="color:#8a9ba3;font-size:.85rem;margin-bottom:1rem">Reinicia tu progreso, racha y chat. No se puede deshacer.</p>
      <button class="btn sec" onclick="reiniciar()">Reiniciar todo</button>
    </div>`;
}

function guardarModelo(){
  localStorage.setItem('groqModel', document.getElementById('modelSel').value);
  alert('✓ Modelo guardado');
}

function reiniciar(){
  if(!confirm('¿Seguro? Se borra todo tu progreso, racha y chat.')) return;
  localStorage.removeItem('estado');
  estado = cargarEstado();
  irTab('home');
}

/* ========== INIT ========== */
document.querySelectorAll('.nav button').forEach(b => {
  b.addEventListener('click', () => irTab(b.dataset.tab));
});
render();

/* PWA: registrar service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => {
      console.warn('SW falló:', err);
    });
  });
}
</script>
