<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudioCS — Aprende a Programar</title>
<meta name="theme-color" content="#131f24">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#131f24;color:#f1f7fb;min-height:100vh}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .sidebar{background:#0e1a1f;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.5rem;border-right:1px solid #2b4048;position:sticky;top:0;height:100vh}
  .logo{font-size:1.2rem;font-weight:800;color:#58cc02;padding:0 .5rem}
  .nav{display:flex;flex-direction:column;gap:.4rem;flex:1}
  .nav button{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:transparent;border:none;color:#8a9ba3;font-size:.95rem;font-weight:600;cursor:pointer;border-radius:10px;text-align:left;font-family:inherit;transition:all .15s}
  .nav button:hover{background:#1f2f36;color:#f1f7fb}
  .nav button.activo{background:#1f2f36;color:#58cc02;border-left:3px solid #58cc02}
  .racha-mini{display:flex;align-items:center;justify-content:center;gap:.4rem;background:#ff9600;color:#fff;padding:.7rem;border-radius:12px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 #c47400}
  main{padding:1.5rem;max-width:900px;margin:0 auto;width:100%}
  h1{font-size:1.5rem;margin-bottom:.3rem}
  .sub{color:#8a9ba3;margin-bottom:1.5rem;font-size:.9rem}
  .card{background:#1f2f36;border:1px solid #2b4048;border-radius:16px;padding:1.2rem;margin-bottom:1rem}
  .card h2{font-size:1.05rem;margin-bottom:.8rem;color:#58cc02}
  .calendario{display:flex;justify-content:space-between;gap:.4rem;margin-bottom:1.5rem}
  .dia{flex:1;text-align:center;padding:.6rem .2rem;background:#1f2f36;border:1px solid #2b4048;border-radius:10px;font-size:.7rem;color:#8a9ba3}
  .dia.activo{background:#58cc02;color:#fff;border-color:#58cc02;font-weight:700}
  .dia.hoy{border:2px solid #f1f7fb}
  .dia .flama{font-size:1.1rem;display:block}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.5rem}
  .stat{background:#1f2f36;border:1px solid #2b4048;border-radius:12px;padding:.8rem;text-align:center}
  .stat .num{font-size:1.4rem;font-weight:700;color:#58cc02}
  .stat .lbl{font-size:.65rem;color:#8a9ba3;text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
  .card-click{background:#1f2f36;border:1px solid #2b4048;border-radius:16px;padding:1rem;cursor:pointer;transition:all .15s}
  .card-click:hover{border-color:#58cc02;transform:translateY(-2px)}
  .card-click h3{font-size:1rem;margin-bottom:.2rem}
  .card-click .emoji{font-size:2rem;display:block;margin-bottom:.5rem}
  .card-click .desc{font-size:.8rem;color:#8a9ba3}
  .barra{height:8px;background:#2b4048;border-radius:999px;overflow:hidden;margin-top:.6rem}
  .barra>div{height:100%;background:#58cc02;transition:width .3s}
  .leccion-card{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:#1f2f36;border:1px solid #2b4048;border-radius:12px;margin-bottom:.6rem;cursor:pointer}
  .leccion-card:hover{border-color:#58cc02}
  .leccion-card.completada{opacity:.6;border-color:#58cc02}
  .leccion-card .check{color:#58cc02;font-size:1.3rem}
  .teoria{background:#0e1a1f;border-left:3px solid #58cc02;padding:1rem;border-radius:8px;margin:1rem 0;font-size:.9rem;line-height:1.7;white-space:pre-wrap;overflow-x:auto}
  .teoria code{background:#1f2f36;padding:.15rem .4rem;border-radius:4px;font-size:.85em}
  .pregunta{font-size:1.1rem;font-weight:600;margin-bottom:1rem}
  .opciones{display:flex;flex-direction:column;gap:.6rem}
  .opcion{padding:.9rem 1rem;background:#1f2f36;border:2px solid #2b4048;border-radius:12px;color:#f1f7fb;font-size:1rem;text-align:left;cursor:pointer;font-family:inherit}
  .opcion:hover{border-color:#58cc02}
  .opcion.correcta{background:#1a3a1a;border-color:#58cc02;color:#58cc02}
  .opcion.incorrecta{background:#3a1a1a;border-color:#ff4b4b;color:#ff4b4b}
  .opcion:disabled{cursor:not-allowed}
  button.btn{padding:.9rem 1.5rem;background:#58cc02;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #46a302;font-family:inherit}
  button.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #46a302}
  button.btn.sec{background:#1f2f36;color:#f1f7fb;box-shadow:0 4px 0 #0e1a1f;border:1px solid #2b4048}
  button.btn:disabled{opacity:.5;cursor:not-allowed}

  .volver:hover{color:#f1f7fb}
  .feedback{padding:.8rem 1rem;border-radius:12px;margin-top:.8rem;font-weight:600}
  .feedback.ok{background:#1a3a1a;color:#58cc02}
  .feedback.bad{background:#3a1a1a;color:#ff4b4b}

  .tutor-wrap{display:flex;flex-direction:column;height:calc(100vh - 3rem);gap:1rem}
  .material-box{background:#1f2f36;border:1px solid #2b4048;border-radius:12px;padding:.8rem 1rem}
  .material-box summary{cursor:pointer;color:#58cc02;font-weight:700;font-size:.9rem}

  .msg{display:flex;gap:.6rem;max-width:90%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem}
  .msg.user .avatar{background:#58cc02}
  .msg.ia .avatar{background:#1f2f36;border:1px solid #2b4048}
  .msg .burbuja{padding:.8rem 1rem;border-radius:14px;line-height:1.5;font-size:.9rem;word-wrap:break-word}
  .msg.user .burbuja{background:#58cc02;color:#fff;border-bottom-right-radius:4px}
  .msg.ia .burbuja{background:#1f2f36;border:1px solid #2b4048;border-bottom-left-radius:4px}
  .msg.ia .burbuja pre{background:#0e1a1f;padding:.8rem;border-radius:8px;overflow-x:auto;margin:.6rem 0;font-size:.8rem}
  .msg.ia .burbuja code{background:#0e1a1f;padding:.1rem .3rem;border-radius:4px;font-size:.85em}
  .msg.ia .burbuja pre code{background:none;padding:0}
  .input-row{display:flex;gap:.5rem}
  .input-row input{flex:1;padding:.9rem 1rem;background:#1f2f36;border:1px solid #2b4048;border-radius:12px;color:#f1f7fb;font-size:1rem;font-family:inherit}

  .input-row button{width:50px;background:#58cc02;border:none;border-radius:12px;color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 0 #46a302}
  .typing{display:flex;gap:4px;padding:.3rem 0}
  .typing span{width:8px;height:8px;background:#8a9ba3;border-radius:50%;animation:bounce 1.4s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.85rem;color:#8a9ba3;margin-bottom:.4rem}
  .field input,.field select{width:100%;padding:.8rem 1rem;background:#0e1a1f;border:1px solid #2b4048;border-radius:10px;color:#f1f7fb;font-family:inherit;font-size:.9rem}
  .aviso{background:#3a2a0e;border-left:3px solid #ff9600;padding:.8rem 1rem;border-radius:8px;font-size:.85rem;color:#ffd8a8;line-height:1.5;margin-bottom:1rem}
  .cargando{text-align:center;padding:3rem 1rem}
  .cargando .spinner{width:40px;height:40px;border:4px solid #2b4048;border-top-color:#58cc02;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem}
  @keyframes spin{to{transform:rotate(360deg)}}

    .app{grid-template-columns:1fr;padding-bottom:80px}
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:70px;flex-direction:row;padding:.5rem;border-right:none;border-top:1px solid #2b4048;align-items:center;justify-content:space-around;z-index:100}
    .logo,.racha-mini{display:none}
    .nav{flex-direction:row;flex:1;justify-content:space-around}
    .nav button{flex-direction:column;gap:.2rem;font-size:.7rem;padding:.5rem}
    main{padding:1rem}
    .tutor-wrap{height:calc(100vh - 140px)}
  }
</style>
</head>

function hoyStr(){return new Date().toISOString().slice(0,10)}
function cargarEstado(){
  let e=JSON.parse(localStorage.getItem('estado')||'null');
  if(!e)e={racha:0,ultimoDia:null,diasActivos:[],completadas:[],chat:[],material:''};
  const hoy=hoyStr();const ayer=new Date();ayer.setDate(ayer.getDate()-1);
  const ayerS=ayer.toISOString().slice(0,10);
  if(e.ultimoDia&&e.ultimoDia!==hoy&&e.ultimoDia!==ayerS)e.racha=0;
  localStorage.setItem('estado',JSON.stringify(e));return e;
}
function guardarEstado(e){localStorage.setItem('estado',JSON.stringify(e))}
function actualizarRacha(){
  const e=cargarEstado();const hoy=hoyStr();
  if(e.ultimoDia===hoy)return;
  const ayer=new Date();ayer.setDate(ayer.getDate()-1);
  if(e.ultimoDia===ayer.toISOString().slice(0,10))e.racha++;else e.racha=1;
  e.ultimoDia=hoy;
  if(!e.diasActivos.includes(hoy)){e.diasActivos.push(hoy);if(e.diasActivos.length>30)e.diasActivos.shift()}
  guardarEstado(e);
}

let estado=cargarEstado();
let tab='home',lengActual=null,modActual=null,leccionesModulo=null;
let lecIdx=0, pregIdx=0, aciertos=0, cargandoIA=false;
let preguntaFallada=null;

function getModuloCache(id){try{return JSON.parse(localStorage.getItem('mod_'+id)||'null')}catch(e){return null}}
function setModuloCache(id,data){localStorage.setItem('mod_'+id,JSON.stringify(data))}

function render(){
  estado=cargarEstado();
  document.getElementById('rachaMini').textContent=estado.racha;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('activo',b.dataset.tab===tab));
  const el=document.getElementById('vista');
  if(tab==='home')renderHome(el);
  else if(tab==='tutor')renderTutor(el);
  else if(tab==='config')renderConfig(el);
  else if(tab==='lenguaje')renderLenguaje(el);
  else if(tab==='modulo')renderModulo(el);
  else if(tab==='leccion')renderLeccion(el);
}

function renderHome(el){
  const totalMods=Object.values(CURRICULOS).reduce((a,c)=>a+c.modulos.length,0);
  const hechas=estado.completadas.length;
  const dias=['D','L','M','X','J','V','S'];
  let cal='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);
    const activo=estado.diasActivos.includes(ds);
    cal+=`<div class="dia ${activo?'activo':''} ${i===0?'hoy':''}"><span class="flama">${activo?'🔥':'·'}</span>${dias[d.getDay()]} ${d.getDate()}</div>`;
  }
  el.innerHTML=`
    <h1>Hola 👋</h1>
    <p class="sub">Racha de ${estado.racha} días · ${hechas} lecciones completadas</p>
    <div class="calendario">${cal}</div>
    <div class="stats">
      <div class="stat"><div class="num">${estado.racha}</div><div class="lbl">Racha</div></div>
      <div class="stat"><div class="num">${hechas}</div><div class="lbl">Lecciones</div></div>
      <div class="stat"><div class="num">${totalMods}</div><div class="lbl">Módulos</div></div>
    </div>
    <div class="card">
      <h2>📚 Mis cursos</h2>
      <div class="grid">
        ${Object.entries(CURRICULOS).map(([id,c])=>{
          const tot=c.modulos.length;
          const hc=c.modulos.filter(m=>estado.completadas.filter(x=>x.startsWith(m.id)).length>=10).length;
          const pct=tot?(hc/tot*100):0;
          return `<div class="card-click" onclick="abrirLenguaje('${id}')">
            <span class="emoji">${c.emoji}</span><h3>${c.nombre}</h3>
            <div class="desc">${c.desc}</div>
            <div class="barra"><div style="width:${pct}%"></div></div>
            <div style="font-size:.75rem;color:#8a9ba3;margin-top:.3rem">${hc}/${tot} módulos</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <h2>💬 ¿Dudas? Pregúntale al Tutor IA</h2>
      <p style="color:#8a9ba3;font-size:.9rem;margin-bottom:1rem">Tu tutor lee tus respuestas y te explica donde fallaste.</p>
      <button class="btn" onclick="irTab('tutor')">Abrir Tutor IA</button>
    </div>`;
}

function renderLenguaje(el){
  const c=CURRICULOS[lengActual];
  el.innerHTML=`
    <button class="volver" onclick="irTab('home')">← Volver</button>
    <h1>${c.emoji} ${c.nombre}</h1><p class="sub">${c.desc} · 20 módulos</p>
    ${c.modulos.map((m,i)=>{
      const cache=getModuloCache(m.id);
      const comp=estado.completadas.filter(x=>x.startsWith(m.id)).length;
      const tot=cache?cache.length:10;const done=comp>=tot;
      return `<div class="leccion-card ${done?'completada':''}" onclick="abrirModulo('${m.id}')">
        <div style="flex:1">
          <div style="font-weight:600">Módulo ${i+1}: ${m.titulo}</div>
          <div style="font-size:.8rem;color:#8a9ba3">${comp}/${tot} lecciones · ${cache?'✓ generado':'🤖 IA genera al abrir'}</div>
        </div>
        <div class="check">${done?'✓':'▶'}</div>
      </div>`;
    }).join('')}`;
}

async function abrirModulo(id){
  tab='modulo'; modActual=id; render();
  const el=document.getElementById('vista');
  let cache=getModuloCache(id);
  if(cache){ leccionesModulo=cache; renderModulo(el); return; }
  
  el.innerHTML=`<div class="cargando"><div class="spinner"></div><p style="font-weight:700;margin-bottom:.5rem">🤖 Generando módulo con IA...</p><p style="color:#8a9ba3;font-size:.85rem">Si el servidor estaba dormido, puede tardar hasta 1 minuto. Por favor, no cierres esta ventana.</p></div>`;
  
  const cur=CURRICULOS[lengActual];
  const mod=cur.modulos.find(m=>m.id===id);
  
  try{
    const urlAPI = 'https://studycast-informatica-1.onrender.com/api/generate-module';
    const r=await fetch(urlAPI, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lenguaje:cur.nombre,titulo:mod.titulo,tema:mod.tema})
    });

    if(!r.ok){
      const errText = await r.text();
      throw new Error(`Error ${r.status}: ${errText.slice(0,50)}`);
    }

    const data=await r.json();
    if(!data.lecciones||data.lecciones.length===0)throw new Error('El servidor no devolvió lecciones');
    
    leccionesModulo=data.lecciones;
    setModuloCache(id,leccionesModulo);
    renderModulo(el);
  }catch(err){
    el.innerHTML=`<button class="volver" onclick="irTab('lenguaje')">← Volver</button>
      <div class="card"><h2>⚠️ Error</h2><p style="color:#8a9ba3">${err.message}</p>
      <button class="btn" onclick="abrirModulo('${id}')" style="margin-top:1rem">Reintentar</button></div>`;
  }
}

function renderModulo(el){
  if(!leccionesModulo){el.innerHTML='<p>Cargando...</p>';return}
  const cur=CURRICULOS[lengActual];
  const mod=cur.modulos.find(m=>m.id===modActual);
  el.innerHTML=`
    <button class="volver" onclick="irTab('lenguaje')">← Volver</button>
    <h1>${mod.titulo}</h1><p class="sub">10 lecciones generadas por IA</p>
    ${leccionesModulo.map((lec,i)=>{
      const idLec=modActual+'-l'+(i+1);
      const done=estado.completadas.includes(idLec);
      return `<div class="leccion-card ${done?'completada':''}" onclick="abrirLeccion(${i})">
        <div style="flex:1">
          <div style="font-weight:600">${i+1}. ${lec.titulo}</div>
          <div style="font-size:.8rem;color:#8a9ba3">${lec.preguntas?lec.preguntas.length:0} preguntas</div>
        </div>
        <div class="check">${done?'✓':'▶'}</div>
      </div>`;
    }).join('')}`;
}

function renderLeccion(el){
  const lec=leccionesModulo[lecIdx];
  const p=lec.preguntas[pregIdx];
  el.innerHTML=`
    <button class="volver" onclick="volverModulo()">← Salir</button>
    <div class="card">
      <div style="font-size:.8rem;color:#8a9ba3;margin-bottom:.5rem">${lec.titulo} · ${pregIdx+1}/${lec.preguntas.length}</div>
      <div class="barra" style="margin-bottom:1rem"><div style="width:${(pregIdx/lec.preguntas.length)*100}%"></div></div>
      <div class="teoria">${renderTeoria(lec.teoria)}</div>
      <div class="pregunta">${p.q}</div>
      <div class="opciones">
        ${p.opciones.map((op,i)=>`<button class="opcion" onclick="responder(${i})" id="op-${i}">${op}</button>`).join('')}
      </div>
      <div id="feedback"></div>
    </div>`;
}

function renderTeoria(t){
  if(!t)return'';
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre style="background:#0e1a1f;padding:.8rem;border-radius:8px;overflow-x:auto;font-size:.8rem;margin:.5rem 0"><code>${c.trim()}</code></pre>`);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\n/g,'<br>');return h;
}

function responder(idx){
  const lec=leccionesModulo[lecIdx];
  const p=lec.preguntas[pregIdx];
  document.querySelectorAll('.opcion').forEach(b=>b.disabled=true);
  const ok=idx===p.correcta;
  document.getElementById('op-'+idx).classList.add(ok?'correcta':'incorrecta');
  if(!ok)document.getElementById('op-'+p.correcta).classList.add('correcta');
  if(ok)aciertos++;
  else{preguntaFallada={q:p.q,tuRespuesta:p.opciones[idx],correcta:p.opciones[p.correcta],explicacion:p.explicacion||'',contexto:lec.titulo+' / '+CURRICULOS[lengActual].nombre};}
  const expl=p.explicacion?`<span class="expl">💡 ${p.explicacion}</span>`:'';
  const botonTutor=!ok?`<button class="btn sec" onclick="pedirExplicacion()" style="margin-left:.5rem;font-size:.9rem;padding:.7rem 1rem">🎓 Explícame mejor</button>`:'';
  document.getElementById('feedback').innerHTML=`
    <div class="feedback ${ok?'ok':'bad'}">${ok?'✓ ¡Correcto!':'✗ Era: '+p.opciones[p.correcta]}${expl}</div>
    <div style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn" onclick="siguientePregunta()">${pregIdx+1<lec.preguntas.length?'Siguiente':'Terminar lección'}</button>
      ${botonTutor}
    </div>`;
}

function pedirExplicacion(){
  if(!preguntaFallada)return;
  const f=preguntaFallada;
  const msg=`Estoy estudiando ${f.contexto}. En la pregunta "${f.q}" yo respondí "${f.tuRespuesta}" pero la correcta es "${f.correcta}". ${f.explicacion?'La explicación dice: '+f.explicacion+'. ':''}¿Puedes explicarme por qué me equivoqué y darme un ejemplo más claro?`;
  irTab('tutor');
  setTimeout(()=>{const inp=document.getElementById('msgInput');if(inp){inp.value=msg;enviar()}},100);
}

function siguientePregunta(){
  const lec=leccionesModulo[lecIdx];
  pregIdx++;
  if(pregIdx>=lec.preguntas.length){
    const pct=aciertos/lec.preguntas.length;
    const idLec=modActual+'-l'+(lecIdx+1);
    if(pct>=0.6){const e=cargarEstado();if(!e.completadas.includes(idLec)){e.completadas.push(idLec);guardarEstado(e);actualizarRacha()}}
    renderFin(pct);
  }else render();
}

function renderFin(pct){
  const el=document.getElementById('vista');
  const lec=leccionesModulo[lecIdx];
  const ok=pct>=0.6;const esUltima=lecIdx>=leccionesModulo.length-1;
  el.innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:3.5rem;margin:1rem 0">${ok?'🎉':'😅'}</div>
      <h2>${ok?'¡Lección completada!':'Casi lo logras'}</h2>
      <p style="margin:1rem 0;color:#8a9ba3">Acertaste ${aciertos} de ${lec.preguntas.length} (${Math.round(pct*100)}%)</p>
      ${ok?`<p style="color:#58cc02;font-weight:700">🔥 Racha: ${estado.racha} días</p>`:'<p style="color:#ff9600">Necesitas 60% para aprobar</p>'}
      <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
        ${esUltima?`<button class="btn" onclick="volverModulo()">🏆 Ver módulo</button>`:`<button class="btn" onclick="siguienteLeccion()">Siguiente lección →</button>`}
        <button class="btn sec" onclick="abrirLeccion(${lecIdx})">Repetir</button>
      </div>
    </div>`;
}
function siguienteLeccion(){lecIdx++;pregIdx=0;aciertos=0;render()}
function abrirLenguaje(id){tab='lenguaje';lengActual=id;leccionesModulo=null;render()}
function volverModulo(){tab='modulo';render()}
function abrirLeccion(idx){tab='leccion';lecIdx=idx;pregIdx=0;aciertos=0;render()}

function renderTutor(el){
  el.innerHTML=`
    <div class="tutor-wrap">
      <div><h1>💬 Tutor IA</h1><p class="sub">Tu tutor lee tus respuestas y te explica donde fallas.</p></div>
      <details class="material-box">
        <summary>📎 Material de estudio (opcional)</summary>
        <textarea id="material" placeholder="Pega apuntes o el tema que estudias...">${estado.material||''}</textarea>
        <button class="btn sec" style="margin-top:.5rem;font-size:.85rem;padding:.6rem 1rem" onclick="guardarMaterial()">Guardar material</button>
      </details>
      <div class="chat" id="chat"></div>
      <div class="input-row"><input id="msgInput" placeholder="Escribe tu pregunta..."><button onclick="enviar()">➤</button></div>
    </div>`;
  pintarChat();
  document.getElementById('msgInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}});
}

function pintarChat(){
  const c=document.getElementById('chat');if(!c)return;
  const e=cargarEstado();
  if(!e.chat||e.chat.length===0){c.innerHTML=`<div style="text-align:center;color:#8a9ba3;padding:2rem 1rem"><div style="font-size:3rem;margin-bottom:.5rem">🎓</div><p>Pregúntame cualquier duda de programación.</p></div>`;return;}
  c.innerHTML=e.chat.map(m=>`<div class="msg ${m.role==='user'?'user':'ia'}"><div class="avatar">${m.role==='user'?'👤':'🎓'}</div><div class="burbuja">${m.role==='user'?escapeHTML(m.text):md(m.text)}</div></div>`).join('');
  if(cargandoIA)c.innerHTML+=`<div class="msg ia"><div class="avatar">🎓</div><div class="burbuja"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  c.scrollTop=c.scrollHeight;
}
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){let h=escapeHTML(t);h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre><code>${c.trim()}</code></pre>`);h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/\n/g,'<br>');return h;}
function guardarMaterial(){const e=cargarEstado();e.material=document.getElementById('material').value;guardarEstado(e);alert('✓ Guardado')}

async function enviar(){
  if(cargandoIA)return;
  const input=document.getElementById('msgInput');const txt=input.value.trim();if(!txt)return;
  input.value='';const e=cargarEstado();e.chat.push({role:'user',text:txt});guardarEstado(e);cargandoIA=true;pintarChat();
  try{
    const model=localStorage.getItem('groqModel')||'openai/gpt-oss-120b';
    const hist=e.chat.slice(-16);
    const sys=`Eres un tutor de programación paciente y claro. Respondes SIEMPRE en español. Cuando el alumno te dice que falló una pregunta, analiza por qué se confundió, explica el concepto desde cero y da un ejemplo concreto. Usa markdown. Sé conciso.`;
    const messages=[{role:'system',content:sys}];
    if(e.material)messages.push({role:'system',content:`Material del alumno:\n${e.material}`});
    hist.forEach(m=>messages.push({role:m.role==='user'?'user':'assistant',content:m.text}));
    
    const urlAPI = 'https://studycast-informatica-1.onrender.com/api/chat';
    
    const r=await fetch(urlAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages,temperature:.7,max_tokens:1024})});
    if(!r.ok)throw new Error('Error '+r.status);
    const data=await r.json();const resp=data.choices?.[0]?.message?.content||'Sin respuesta';
    const e2=cargarEstado();e2.chat.push({role:'model',text:resp});if(e2.chat.length>40)e2.chat=e2.chat.slice(-40);guardarEstado(e2);
  }catch(err){const e2=cargarEstado();e2.chat.push({role:'model',text:'⚠️ '+err.message});guardarEstado(e2);}finally{cargandoIA=false;pintarChat()}
}

function renderConfig(el){
  const model=localStorage.getItem('groqModel')||'openai/gpt-oss-120b';
  el.innerHTML=`
    <h1>⚙️ Configuración</h1><p class="sub">Ajustes de la app</p>
    <div class="aviso">🔒 La API key está configurada en el servidor. No se guarda en el navegador.</div>
    <div class="card">
      <h2>🤖 Modelo de IA</h2>
      <div class="field"><label>Modelo de Groq</label>
        <select id="modelSel">
          <option value="openai/gpt-oss-120b" ${model==='openai/gpt-oss-120b'?'selected':''}>GPT-OSS 120B (recomendado)</option>
          <option value="openai/gpt-oss-20b" ${model==='openai/gpt-oss-20b'?'selected':''}>GPT-OSS 20B (rápido)</option>
          <option value="qwen/qwen3-32b" ${model==='qwen/qwen3-32b'?'selected':''}>Qwen 3 32B</option>
        </select>
      </div>
      <button class="btn" onclick="guardarModelo()">Guardar</button>
    </div>
    <div class="card">
      <h2>🧹 Datos</h2>
      <p style="color:#8a9ba3;font-size:.85rem;margin-bottom:1rem">Reinicia progreso, racha, chat y módulos generados.</p>
      <button class="btn sec" onclick="reiniciar()">Reiniciar todo</button>
      <button class="btn sec" onclick="borrarModulos()" style="margin-left:.5rem">Borrar módulos IA</button>
    </div>`;
}
function guardarModelo(){localStorage.setItem('groqModel',document.getElementById('modelSel').value);alert('✓ Guardado')}
function reiniciar(){if(!confirm('¿Borrar todo?'))return;Object.keys(localStorage).forEach(k=>{if(k.startsWith('mod_')||k==='estado')localStorage.removeItem(k)});estado=cargarEstado();irTab('home')}
function borrarModulos(){if(!confirm('¿Borrar módulos generados?'))return;Object.keys(localStorage).forEach(k=>{if(k.startsWith('mod_'))localStorage.removeItem(k)});alert('✓ Borrados')}
function irTab(t){tab=t;if(t!=='lenguaje'&&t!=='modulo'&&t!=='leccion'){lengActual=null;modActual=null;leccionesModulo=null}render()}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>irTab(b.dataset.tab)));
render();

// Service Worker desactivado temporalmente para pruebas
// if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
</html>
